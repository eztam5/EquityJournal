[package]
name = "equity-journal"
version = "0.1.0"
description = "Personal investment research and journaling"
authors = ["EquityJournal"]
edition = "2021"

[lib]
name = "equity_journal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
dirs = "5"
