name: Release EquityJournal

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            assetName: "EquityJournal-[version]-macos-arm64.[ext]"

          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            assetName: "EquityJournal-[version]-macos-x64.[ext]"

          - platform: windows-latest
            args: ""
            assetName: "EquityJournal-[version]-windows-x64[_setup].[ext]"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            ${{ startsWith(matrix.platform, 'macos')
                && 'aarch64-apple-darwin,x86_64-apple-darwin'
                || '' }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "EquityJournal ${{ github.ref_name }}"
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          releaseAssetNamePattern: ${{ matrix.assetName }}
